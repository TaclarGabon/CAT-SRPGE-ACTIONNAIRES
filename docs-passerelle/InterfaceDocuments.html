<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>CAT-SRPGE — Documents</title><style>
body{font:16px system-ui,Arial;background:#f2f6fa;color:#173451;margin:0;padding:22px}.panel{max-width:680px;margin:auto;background:white;border-radius:16px;border:1px solid #d6e4ee;padding:24px;box-shadow:0 4px 24px #0001}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac9d5;border-radius:9px;margin:6px 0 12px}button{background:#1a5ab7;color:white;cursor:pointer;border:0;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#576b7d;font-size:13px}.hidden{display:none}.file{padding:8px;border-bottom:1px solid #e0e8ef}#message{padding:10px;white-space:pre-wrap}</style></head><body><div class="panel"><h1>CAT-SRPGE — Mes justificatifs</h1><p class="muted">Version de développement. Utilise uniquement des fichiers fictifs. Les documents restent privés dans Google Drive.</p>
<div id="login"><label>Adresse e-mail Firebase<input id="email" type="email" autocomplete="off"></label><label>Mot de passe<input id="password" type="password" autocomplete="off"></label><button id="connect">Connexion</button></div>
<div id="workspace" class="hidden"><p id="who"></p><button id="disconnect">Déconnexion</button><label>UID du dossier actionnaire à consulter (laisser vide pour son propre dossier ; responsables uniquement pour un autre dossier)<input id="ownerUid" placeholder="UID Firebase actionnaire" autocomplete="off"></label><label>Identifiant permanent de la souscription<input id="operation" placeholder="op-..." autocomplete="off"></label><button id="load">Afficher les documents</button><div id="documents"></div><hr><label>Type de document<select id="type"><option value="bulletin">Bulletin de souscription</option><option value="justificatif">Justificatif de versement</option></select></label><label>PDF ou image fictive (4 Mo maximum)<input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"></label><button id="upload">Joindre le fichier</button></div><p id="message" role="status"></p></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,inMemoryPersistence}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const cfg={apiKey:'AIzaSyDmZaBBjKuSPuXcM1FrMH4H4v3DxRFUs2E',authDomain:'cat-collectif-actionnaires.firebaseapp.com',projectId:'cat-collectif-actionnaires'};
const auth=getAuth(initializeApp(cfg)), el=id=>document.getElementById(id);
const msg=s=>el('message').textContent=s;
const call=(fn,data)=>new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](data)});
let uid='';
// Dans Apps Script HTML Service, location.search peut décrire l'iframe interne
// plutôt que l'URL /exec. Lire les paramètres via l'API officielle du conteneur.
google.script.url.getLocation(loc=>{
  const p=loc&&loc.parameter||{};
  if(typeof p.operationId==='string'&&/^op-[A-Za-z0-9-]{8,150}$/.test(p.operationId))el('operation').value=p.operationId;
  if(typeof p.ownerUid==='string'&&/^[A-Za-z0-9]{10,128}$/.test(p.ownerUid))el('ownerUid').value=p.ownerUid;
});
await setPersistence(auth,inMemoryPersistence);
onAuthStateChanged(auth,u=>{uid=u?.uid||'';el('login').classList.toggle('hidden',!!u);el('workspace').classList.toggle('hidden',!u);el('who').textContent=u?'Connecté : '+u.email:'';el('documents').replaceChildren();});
el('connect').onclick=async()=>{try{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);el('password').value='';msg('Connecté. Sélectionne une souscription.')}catch(e){msg('Connexion impossible. Vérifie les identifiants.')}};
el('disconnect').onclick=()=>signOut(auth);
async function argumentsAuth(){const u=auth.currentUser;if(!u)throw Error('Connexion requise');return {ownerUid:el('ownerUid').value.trim()||u.uid,idToken:await u.getIdToken(),operationId:el('operation').value.trim()}}
el('load').onclick=async()=>{try{msg('Chargement…');const x=await argumentsAuth();const files=await call('catList',x);const list=el('documents');list.replaceChildren();for(const f of files){const row=document.createElement('div');row.className='file';const b=document.createElement('button');b.textContent='Ouvrir : '+f.name;b.onclick=async()=>{try{msg('Ouverture…');const data=await call('catDownload',{...await argumentsAuth(),fileId:f.id});const binary=atob(data.base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:data.mime}));const a=document.createElement('a');a.href=url;a.download=data.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);msg('Document téléchargé.')}catch(e){msg(e.message||'Ouverture refusée')}};row.append(b);list.append(row)}msg(files.length+' document(s) trouvé(s).')}catch(e){msg(e.message||'Accès refusé.')}}; 
el('upload').onclick=async()=>{const f=el('file').files[0];if(!f){msg('Sélectionne un document fictif.');return}if(f.size>4*1024*1024){msg('Maximum 4 Mo');return}if(!['application/pdf','image/png','image/jpeg'].includes(f.type)){msg('Format non accepté');return}const b=el('upload');b.disabled=true;try{msg('Envoi en cours…');const x=await argumentsAuth();const raw=await f.arrayBuffer(),bytes=new Uint8Array(raw);let str='';for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.slice(i,i+8192));const result=await call('catUpload',{...x,type:el('type').value,mime:f.type,base64:btoa(str)});msg(result.ok?'Fichier enregistré. Clique sur Afficher les documents.':'Envoi non confirmé');el('file').value=''}catch(e){msg(e.message||'Échec de l’envoi')}finally{b.disabled=false}};
</script></body></html>
