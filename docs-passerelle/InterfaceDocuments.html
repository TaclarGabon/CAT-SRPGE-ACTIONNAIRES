<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>CAT-SRPGE — Documents</title><style>
body{font:16px system-ui,Arial;background:#f2f6fa;color:#173451;margin:0;padding:22px}.panel{max-width:680px;margin:auto;background:white;border-radius:16px;border:1px solid #d6e4ee;padding:24px;box-shadow:0 4px 24px #0001}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac9d5;border-radius:9px;margin:6px 0 12px}button{background:#1a5ab7;color:white;cursor:pointer;border:0;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#576b7d;font-size:13px}.hidden{display:none}.file{padding:8px;border-bottom:1px solid #e0e8ef}#message{padding:10px;white-space:pre-wrap}</style></head><body><div class="panel"><h1>CAT-SRPGE — Mes justificatifs</h1><p class="muted">Version de développement. Utilise uniquement des fichiers fictifs. Les documents restent privés dans Google Drive.</p>
<div id="login"><label>Adresse e-mail Firebase<input id="email" type="email" autocomplete="off"></label><label>Mot de passe<input id="password" type="password" autocomplete="off"></label><button id="connect">Connexion</button></div>
<div id="workspace" class="hidden"><p id="who"></p><button id="disconnect">Déconnexion</button><section id="simple" style="border:2px solid #bfd4ed;background:#f3f8ff;padding:14px;border-radius:12px;margin:12px 0"><h2 style="font-size:19px;margin:0 0 9px">Consultation simplifiée — V11</h2><button id="directory">Charger mes dossiers / annuaire Direction</button><label>Actionnaire<select id="person"><option value="">Charger l'annuaire d'abord</option></select></label><label>Projet<select id="project"><option value="">Choisir un actionnaire</option></select></label><button id="simpleLoad">Afficher les justificatifs de ce projet</button><p class="muted" id="directoryStatus">Les identifiants seront renseignés automatiquement.</p></section><details><summary style="cursor:pointer;font-weight:650;margin:8px 0">Saisie manuelle UID / OPID (mode technique)</summary><label>UID du dossier actionnaire à consulter (laisser vide pour son propre dossier ; responsables uniquement pour un autre dossier)<input id="ownerUid" placeholder="UID Firebase actionnaire" autocomplete="off"></label><label>Identifiant permanent de la souscription<input id="operation" placeholder="op-..." autocomplete="off"></label><button id="load">Afficher les documents (manuel)</button></details><div id="documents"></div><button id="archive" style="background:#6b7280" class="hidden">Archiver les documents affichés (tests)</button><hr><label>Type de document<select id="type"><option value="bulletin">Bulletin de souscription</option><option value="justificatif">Justificatif de versement</option></select></label><label>PDF ou image fictive (4 Mo maximum)<input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"></label><button id="upload">Joindre le fichier</button></div><p id="message" role="status"></p></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,inMemoryPersistence}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const cfg={apiKey:'AIzaSyDmZaBBjKuSPuXcM1FrMH4H4v3DxRFUs2E',authDomain:'cat-collectif-actionnaires.firebaseapp.com',projectId:'cat-collectif-actionnaires'};
const auth=getAuth(initializeApp(cfg)), el=id=>document.getElementById(id);
const msg=s=>el('message').textContent=s;
const call=(fn,data)=>new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](data)});
let uid='';let directory=[];let directoryAdmin=false;
const clearDirectory=()=>{directory=[];directoryAdmin=false;el('person').replaceChildren(new Option('Charger l’annuaire d’abord',''));el('project').replaceChildren(new Option('Choisir un actionnaire',''));el('directoryStatus').textContent='Les identifiants seront renseignés automatiquement.';};
// Dans Apps Script HTML Service, location.search peut décrire l'iframe interne
// plutôt que l'URL /exec. Lire les paramètres via l'API officielle du conteneur.
google.script.url.getLocation(loc=>{
  const p=loc&&loc.parameter||{};
  if(typeof p.operationId==='string'&&/^op-[A-Za-z0-9-]{8,150}$/.test(p.operationId))el('operation').value=p.operationId;
  if(typeof p.ownerUid==='string'&&/^[A-Za-z0-9]{10,128}$/.test(p.ownerUid))el('ownerUid').value=p.ownerUid;
});
await setPersistence(auth,inMemoryPersistence);
onAuthStateChanged(auth,u=>{const nextUid=u?.uid||'';if(uid&&uid!==nextUid){el('ownerUid').value='';el('operation').value='';el('file').value='';clearDirectory();}uid=nextUid;el('login').classList.toggle('hidden',!!u);el('workspace').classList.toggle('hidden',!u);el('who').textContent=u?'Connecté : '+u.email:'';el('documents').replaceChildren();el('archive').classList.add('hidden');});

el('directory').onclick=async()=>{
  try{
    msg('Chargement des dossiers autorisés…');
    const u=auth.currentUser;if(!u)throw Error('Connexion requise');
    const result=await call('catDirectoryV11',{idToken:await u.getIdToken()});
    directory=result.shareholders||[];directoryAdmin=!!result.admin;
    const sel=el('person');sel.replaceChildren(new Option('Choisir un actionnaire',''));
    for(const person of directory)sel.add(new Option(person.name+' ('+person.projects.length+' projet(s))',person.ownerUid));
    el('project').replaceChildren(new Option('Choisir un actionnaire',''));
    el('directoryStatus').textContent=(directoryAdmin?'Annuaire Direction':'Mes projets')+' : '+directory.length+' actionnaire(s) disponibles.';
    if(!directoryAdmin&&directory.length===1){sel.value=directory[0].ownerUid;sel.dispatchEvent(new Event('change'));}
    msg('Dossiers chargés. Sélectionne un projet.');
  }catch(e){msg('Annuaire indisponible : '+(e.message||'Erreur'));clearDirectory();}
};
el('person').onchange=()=>{
  const who=directory.find(x=>x.ownerUid===el('person').value);
  const select=el('project');select.replaceChildren(new Option('Choisir un projet',''));
  for(const p of who?.projects||[])select.add(new Option(p.projet,p.operationId));
  el('documents').replaceChildren();el('archive').classList.add('hidden');
};
el('simpleLoad').onclick=()=>{
  const person=directory.find(x=>x.ownerUid===el('person').value);
  const opId=el('project').value;
  if(!person||!person.projects.some(x=>x.operationId===opId)){msg('Choisis un actionnaire et un projet.');return}
  el('ownerUid').value=person.ownerUid===uid?'':person.ownerUid;
  el('operation').value=opId;
  el('load').click();
};

el('connect').onclick=async()=>{try{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);el('password').value='';msg('Connecté. Sélectionne une souscription.')}catch(e){msg('Connexion impossible. Vérifie les identifiants.')}};
el('disconnect').onclick=async()=>{el('ownerUid').value='';el('operation').value='';el('file').value='';clearDirectory();el('documents').replaceChildren();el('archive').classList.add('hidden');await signOut(auth);msg('Déconnecté. Les références du dossier ont été effacées.');};
async function argumentsAuth(){const u=auth.currentUser;if(!u)throw Error('Connexion requise');return {ownerUid:el('ownerUid').value.trim()||u.uid,idToken:await u.getIdToken(),operationId:el('operation').value.trim()}}
el('load').onclick=async()=>{try{msg('Chargement…');const x=await argumentsAuth();const files=await call('catList',x);const list=el('documents');list.replaceChildren();el('archive').classList.toggle('hidden',!files.length||x.ownerUid!==uid);for(const f of files){const row=document.createElement('div');row.className='file';const b=document.createElement('button');b.textContent='Ouvrir : '+String(f.name||'').replace(/\s*—\s*[0-9a-f]{8}-[0-9a-f-]{27,}\.([A-Za-z0-9]+)$/i,'.$1').replace(/\s*—\s*Souscription(?=\.|\s*—)/gi,'');b.onclick=async()=>{try{msg('Ouverture…');const data=await call('catDownload',{...await argumentsAuth(),fileId:f.id});const binary=atob(data.base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:data.mime}));const a=document.createElement('a');a.href=url;a.download=data.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);msg('Document téléchargé.')}catch(e){msg(e.message||'Ouverture refusée')}};row.append(b);list.append(row)}msg(files.length+' document(s) trouvé(s).')}catch(e){msg(e.message||'Accès refusé.')}}; 
el('archive').onclick=async()=>{const x=await argumentsAuth();if(x.ownerUid!==uid){msg('Archivage reserve au titulaire');return}if(!confirm('Archiver TOUS les documents affiches pour cette operation ? Ils disparaitront de la liste sans etre supprimes du Drive.'))return;const phrase=prompt('Pour confirmer, ecris exactement : ARCHIVER TESTS');if(phrase!=='ARCHIVER TESTS'){msg('Archivage annule.');return}const b=el('archive');b.disabled=true;try{const result=await call('catArchiveTests',{...x,confirmation:phrase});msg(result.count+' fichier(s) archives dans le Drive prive. Clique sur Afficher les documents.');el('documents').replaceChildren();b.classList.add('hidden')}catch(e){msg(e.message||'Archivage refuse')}finally{b.disabled=false}};
el('upload').onclick=async()=>{const f=el('file').files[0];if(!f){msg('Sélectionne un document fictif.');return}if(f.size>4*1024*1024){msg('Maximum 4 Mo');return}if(!['application/pdf','image/png','image/jpeg'].includes(f.type)){msg('Format non accepté');return}const b=el('upload');b.disabled=true;try{msg('Envoi en cours…');const x=await argumentsAuth();const raw=await f.arrayBuffer(),bytes=new Uint8Array(raw);let str='';for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.slice(i,i+8192));const result=await call('catUpload',{...x,type:el('type').value,mime:f.type,originalName:f.name,base64:btoa(str)});msg(result.ok?'Fichier enregistré. Clique sur Afficher les documents.':'Envoi non confirmé');el('file').value=''}catch(e){msg(e.message||'Échec de l’envoi')}finally{b.disabled=false}};
</script></body></html>
